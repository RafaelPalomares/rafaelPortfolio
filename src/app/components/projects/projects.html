<section class="section" id="projects">
  <div class="container">
    <span class="section-label">Projects</span>
    <h2 class="section-title">Things I've built</h2>

    <div class="projects-list">
      <article class="project-card" *ngFor="let project of projects">

        <!-- Left: number + status -->
        <div class="project-meta">
          <span class="project-number">{{ project.number }}</span>
          <span class="project-status" [attr.data-status]="project.status">
            {{ project.status === 'live' ? '● Live' : project.status === 'wip' ? '◐ In Progress' : '○ Archived' }}
          </span>
        </div>

        <!-- Center: content -->
        <div class="project-body">
          <h3 class="project-name">{{ project.name }}</h3>
          <p class="project-tagline">{{ project.tagline }}</p>
          <p class="project-desc">{{ project.description }}</p>

          <ul class="project-stack">
            <li *ngFor="let tech of project.stack">{{ tech }}</li>
          </ul>
        </div>

        <!-- Right: links -->
        <div class="project-links">
          <a
            *ngIf="project.liveUrl"
            [href]="project.liveUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="project-link project-link--live"
            aria-label="View live site for {{ project.name }}"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Live
          </a>
          <a
            *ngIf="project.repoUrl"
            [href]="project.repoUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="project-link project-link--repo"
            aria-label="View source code for {{ project.name }}"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            Code
          </a>
        </div>

      </article>
    </div>
  </div>
</section>
