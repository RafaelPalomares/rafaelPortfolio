<section class="section" id="top-picks">
  <div class="container">
    <span class="section-label">Favourites</span>
    <h2 class="section-title">My Top 3</h2>

    <!-- Films -->
    <div class="picks-group">
      <h3 class="picks-category">🎬 Films</h3>
      <div class="picks-row">
        <div
          class="pick-card"
          *ngFor="let film of films(); let i = index"
          [class.flipped]="film.flipped"
          (click)="flipFilm(i)"
        >
          <div class="pick-front">
            <img [src]="film.posterUrl" [alt]="film.title" class="pick-poster" />
            <div class="pick-rank">#{{ i + 1 }}</div>
            <div class="pick-hint">tap to flip</div>
          </div>
          <div class="pick-back">
            <span class="pick-back-rank">#{{ i + 1 }}</span>
            <h4 class="pick-back-title">{{ film.title }}</h4>
            <p class="pick-back-meta">{{ film.year }} · {{ film.director }}</p>
            <p class="pick-back-note">{{ film.note }}</p>
            <span class="pick-back-rating" *ngIf="film.rating">★ {{ film.rating }}/10</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Books -->
    <div class="picks-group">
      <h3 class="picks-category">📚 Books</h3>
      <div class="picks-row">
        <div
          class="pick-card"
          *ngFor="let book of books(); let i = index"
          [class.flipped]="book.flipped"
          (click)="flipBook(i)"
        >
          <div class="pick-front">
            <img [src]="book.coverUrl" [alt]="book.title" class="pick-poster" />
            <div class="pick-rank">#{{ i + 1 }}</div>
            <div class="pick-hint">tap to flip</div>
          </div>
          <div class="pick-back">
            <span class="pick-back-rank">#{{ i + 1 }}</span>
            <h4 class="pick-back-title">{{ book.title }}</h4>
            <p class="pick-back-meta">{{ book.author }}<span *ngIf="book.pages"> · {{ book.pages }} pages</span></p>
            <p class="pick-back-note">{{ book.note }}</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
