<section class="section section-alt" id="music">
  <div class="container">
    <span class="section-label">Music</span>
    <h2 class="section-title">Artists I love</h2>

    <div class="music-grid">
      <div
        class="music-card"
        *ngFor="let idol of idols; let i = index"
        [class.music-card--active]="playingIndex === i"
      >
        <!-- Artist image / fallback -->
        <div class="music-avatar-wrap">
          <div class="music-avatar">
            <img
              *ngIf="idol.imageUrl; else noImg"
              [src]="idol.imageUrl"
              [alt]="idol.name"
              class="music-img"
            />
            <ng-template #noImg>
              <span class="music-initial">{{ idol.name.charAt(0) }}</span>
            </ng-template>
          </div>
          <button
            *ngIf="idol.copyright"
            class="cr-btn"
            [class.cr-btn--open]="openCopyright === idol.name"
            (click)="toggleCopyright(idol.name)"
            [attr.aria-label]="'Copyright info for ' + idol.name"
          >© cr</button>
        </div>

        <!-- Info -->
        <div class="music-info">
          <h3 class="music-name">{{ idol.name }}</h3>
          <p class="music-genre">{{ idol.genre }}</p>
          <p class="music-reason">{{ idol.reason }}</p>

          <!-- Play toggle button -->
          <button
            *ngIf="idol.featuredSong"
            class="play-btn"
            [class.play-btn--active]="playingIndex === i"
            (click)="togglePlay(i)"
            [attr.aria-label]="(playingIndex === i ? 'Hide' : 'Listen to') + ' ' + idol.featuredSong.title"
          >
            <span class="play-icon">{{ playingIndex === i ? '■' : '▶' }}</span>
            <span class="play-label">
              {{ playingIndex === i ? 'Hide player' : idol.featuredSong.title }}
            </span>
          </button>
        </div>
      </div>

      <!-- Player panel — spans full grid width, shown below active card -->
      <div
        class="player-panel"
        *ngIf="playingIndex !== null && idols[playingIndex].featuredSong"
      >
        <div class="player-panel__header">
          <span class="player-panel__title">
            {{ idols[playingIndex].name }} — {{ idols[playingIndex].featuredSong!.title }}
          </span>
          <button class="player-panel__close" (click)="playingIndex = null" aria-label="Close player">✕</button>
        </div>

        <!-- Native audio -->
        <audio
          *ngIf="idols[playingIndex].featuredSong!.type === 'audio'"
          controls
          autoplay
          class="audio-el"
          [src]="idols[playingIndex].featuredSong!.audioUrl"
        ></audio>

        <!-- Embed: Spotify / YouTube / SoundCloud -->
        <iframe
          *ngIf="idols[playingIndex].featuredSong?.type === 'embed'"
          data-testid="embed-iframe"
          style="border-radius:12px"
          [src]="safeUrl(idols[playingIndex].featuredSong?.audioUrl || '')"
          width="100%"
          height="352"
          frameborder="0"
          allowfullscreen
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
        ></iframe>
      </div>

      <!-- Copyright panel -->
      <div class="cr-panel" *ngIf="openCopyright" style="grid-column: 1 / -1">
        <ng-container *ngFor="let idol of idols">
          <ng-container *ngIf="openCopyright === idol.name && idol.copyright">
            <span class="cr-panel__icon">©</span>
            <span class="cr-panel__text">{{ idol.copyright }}</span>
            <button class="cr-panel__close" (click)="openCopyright = null" aria-label="Close">✕</button>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </div>
</section>
