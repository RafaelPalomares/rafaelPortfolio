<section class="section section-alt" id="music">
  <div class="container">
    <span class="section-label">Music</span>
    <h2 class="section-title">Artists I love</h2>

    <div class="music-grid">
      <div
        class="music-card"
        *ngFor="let idol of idols; let i = index"
        [class.music-card--active]="playingIndex === i"
      >
        <!-- Avatar -->
        <div class="music-avatar-wrap">
          <div class="music-avatar">
            <img
              *ngIf="idol.imageUrl; else noImg"
              [src]="idol.imageUrl"
              [alt]="idol.name"
              class="music-img"
            />

            <ng-template #noImg>
              <span class="music-initial">
                {{ idol.name.charAt(0) }}
              </span>
            </ng-template>
          </div>

          <button
            *ngIf="idol.copyright"
            class="cr-btn"
            [class.cr-btn--open]="openCopyright === idol.name"
            (click)="toggleCopyright(idol.name)"
          >
            © cr
          </button>
        </div>

        <!-- Info -->
        <div class="music-info">
          <h3 class="music-name">{{ idol.name }}</h3>

          <p class="music-genre">
            {{ idol.genre }}
          </p>

          <p class="music-reason">
            {{ idol.reason }}
          </p>

          <!-- Play button -->
          <button
            *ngIf="idol.featuredSong"
            class="play-btn"
            [class.play-btn--active]="playingIndex === i"
            (click)="togglePlay(i)"
          >
            <span class="play-btn__icon">
              {{ playingIndex === i ? '■' : '▶' }}
            </span>

            <span class="play-btn__text">
              <span class="play-btn__action">
                {{ playingIndex === i ? 'Hide Player' : 'Listen Now' }}
              </span>

              <span class="play-btn__title">
                {{ idol.featuredSong.title }}
              </span>
            </span>
          </button>
        </div>
      </div>

      <!-- PLAYER PANEL -->
      <div
        class="player-panel"
        *ngIf="playingIndex !== null && idols[playingIndex].featuredSong"
      >
        <div class="player-panel__header">
          <span class="player-panel__title">
            {{ idols[playingIndex].name }}
            —
            {{ idols[playingIndex].featuredSong!.title }}
          </span>

          <button
            class="player-panel__close"
            (click)="playingIndex = null"
          >
            ✕
          </button>
        </div>

        <!-- Audio -->
        <audio
          *ngIf="idols[playingIndex].featuredSong!.type === 'audio'"
          controls
          autoplay
          class="audio-el"
          [src]="idols[playingIndex].featuredSong!.audioUrl"
        ></audio>

        <!-- Embed -->
        <iframe
          *ngIf="idols[playingIndex].featuredSong?.type === 'embed'"
          [src]="safeUrl(idols[playingIndex].featuredSong?.audioUrl || '')"
          class="embed-frame"
          allowfullscreen
          loading="lazy"
        ></iframe>
      </div>
    </div>
  </div>
</section>
