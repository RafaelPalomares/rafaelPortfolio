<section class="section" id="clips">
  <div class="container">
    <span class="section-label">On the court</span>
    <h2 class="section-title">My clips</h2>
  </div>

  <div class="clips-stage">
    <!-- video -->
    <video
      #videoEl
      class="clips-video"
      src="RafaelVolleyClips.mp4"
      muted
      playsinline
      preload="metadata"
      (ended)="onEnded()"
    ></video>

    <!-- overlay shown when paused -->
    <div class="clips-overlay" [class.hidden]="playing()">
      <button class="clips-play-btn" (click)="toggle()" aria-label="Play video">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
    </div>

    <!-- controls bar -->
    <div class="clips-controls" [class.visible]="playing()">
      <button class="ctrl-btn" (click)="toggle()" [attr.aria-label]="playing() ? 'Pause' : 'Play'">
        <svg *ngIf="playing()" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
        <svg *ngIf="!playing()" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <button class="ctrl-btn" (click)="toggleMute()" [attr.aria-label]="muted() ? 'Unmute' : 'Mute'">
        <svg *ngIf="muted()" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16.5 12A4.5 4.5 0 0 0 14 7.97V10.18l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 18l1.73 1.73L21 18.46 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
        <svg *ngIf="!muted()" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>

      <span class="ctrl-label">Rafael Palomares · Volleyball Clips</span>
    </div>
  </div>
</section>
