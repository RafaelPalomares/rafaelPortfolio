<section class="section section-alt" id="films">
  <div class="container">
    <span class="section-label">Films</span>
    <h2 class="section-title">What I've watched</h2>

    <!-- Stats -->
    <div class="film-stats">
      <span class="fs-chip">🎬 {{ stats().total }} films</span>
      <span class="fs-chip">✓ {{ stats().watched }} watched</span>
      <span class="fs-chip" *ngIf="stats().watching">▶ {{ stats().watching }} watching</span>
      <span class="fs-chip">📋 {{ stats().wantToWatch }} watchlist</span>
    </div>

    <!-- Filters -->
    <div class="film-filters">
      <button class="filter-btn" [class.active]="activeFilter() === 'all'" (click)="setFilter('all')">All</button>
      <button class="filter-btn" [class.active]="activeFilter() === 'watched'" (click)="setFilter('watched')">Watched</button>
      <button class="filter-btn" [class.active]="activeFilter() === 'watching'" (click)="setFilter('watching')">Watching</button>
      <button class="filter-btn" [class.active]="activeFilter() === 'want-to-watch'" (click)="setFilter('want-to-watch')">Watchlist</button>
    </div>

    <!-- Film grid -->
    <div class="films-grid">
      <div class="film-card" *ngFor="let film of filteredFilms()">
        <!-- Poster -->
        <div class="film-poster-wrap">
          <img [src]="film.posterUrl" [alt]="film.title + ' poster'" class="film-poster" loading="lazy" />
          <span class="film-status-badge" [attr.data-status]="film.status">
            {{ statusLabel(film.status) }}
          </span>
          <span class="film-rating" *ngIf="film.rating">
            ★ {{ film.rating }}/10
          </span>
        </div>

        <!-- Info -->
        <div class="film-info">
          <h3 class="film-title">{{ film.title }}</h3>
          <p class="film-meta">{{ film.year }} · {{ film.director }}</p>
          <p class="film-note" *ngIf="film.note">{{ film.note }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
